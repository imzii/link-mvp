<style>

label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}

.hero{padding:8px 0 4px}.hero h1{font-size:30px;line-height:1.3}

function setPath(o,p,v){ const k=p.split('.'); for(let i=0;i<k.length-1;i++) o=(o[k[i]] ??= {}); if(v===null) delete o[k.at(-1)]; else o[k.at(-1)]=v; }

  k:c=>'link.room.'+c, bc:'BroadcastChannel' in window ? new BroadcastChannel('link') : null, subs:new Set(),
  async get(c){ return ls.get(this.k(c)); },
  async create(c,d){ ls.set(this.k(c),d); this.ping(c); },
  async update(c,patch){ const d=ls.get(this.k(c)); if(!d) throw new Error('no room'); for(const [k,v] of Object.entries(patch)) setPath(d,k,v); ls.set(this.k(c),d); this.ping(c); },
  ping(c){ this.bc?.postMessage(c); this.subs.forEach(s=>s.c===c&&s.f()); },
  subscribe(c,cb){ const s={c,f:()=>cb(ls.get(this.k(c)))}; this.subs.add(s);

async function makeFirebase(cfg){
  const B='https://www.gstatic.com/firebasejs/10.12.5/';
  const { initializeApp } = await import(B+'firebase-app.js'); const fs = await import(B+'firebase-firestore.js');
  const db = fs.getFirestore(initializeApp(cfg)), ref = c => fs.doc(db,'rooms',c);
  return {
    async get(c){ const s=await fs.getDoc(ref(c)); return s.exists()?s.data():null; },
    async create(c,d){ await fs.setDoc(ref(c),d); },
    async update(c,patch){ const p={}; for(const [k,v] of Object.entries(patch)) p[k]= v===null?fs.deleteField():v; await fs.updateDoc(ref(c),p); },
    subscribe(c,cb){ return fs.onSnapshot(ref(c), s=>cb(s.exists()?s.data():null), e=>toast('서버 연결 오류: '+e.code)); }
  };
}

  ['계획을 세우는 일','직접 만드는 일','정리형','실행형'],
  ['처음 방향을 넓게 여는 일','마감 전에 끝까지 마무리하는 일','아이디어형','실행형'],
  ['질문을 받고 설명하는 것','혼자 깊게 파고드는 것','발표형','아이디어형']
];
const TRAITS = { '아이디어형':'새 관점을 여는 사람', '정리형':'흩어진 것을 구조로 만드는 사람', '발표형':'생각을 전달하는 사람', '실행형':'끝까지 만들어 내는 사람' };
const PHASES = [['lobby','FIT'],['in','POP'],['sync','MIX'],['up','RUN']];
const uniq = (arr,key=x=>x) => { const seen=new Set(); return arr.filter(x=>{ const k=key(x); if(seen.has(k)) return false; seen.add(k); return true; }); };
const typesOf = r => (r.types&&r.types.length) ? r.types : [r.type||'plan'];
const TT = r => { const ks=typesOf(r).filter(k=>TYPES[k]);
  return { names: ks.map(k=>TYPES[k].name), crit: uniq(ks.flatMap(k=>TYPES[k].crit)),
    hints: ks.flatMap(k=>TYPES[k].hints.map(q=>({q,tag:TYPES[k].name}))),
    roles: uniq(ks.flatMap(k=>TYPES[k].roles),x=>x[0]), plan: uniq(ks.flatMap(k=>TYPES[k].plan),x=>x[0]) }; };
const critOf = r => (r.crit&&r.crit.length) ? r.crit : TT(r).crit;
const sortedMembers = r => Object.entries(r.members||{}).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));

/* ================== '규칙 기반 AI' (실제 서비스에서 LLM으로 교체) ================== */
const JOSA = /(으로|에서|에게|하고|이나|이랑|부터|까지|처럼|보다|을|를|이|가|은|는|의|에|로|와|과|도|만|한다|하기|하는|해서|하면|하여)$/;
const words = t => (t||'').replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).map(w=>w.replace(JOSA,'')).filter(w=>w.length>=2);
const grams = t => { const s=(t||'').replace(/[^\p{L}\p{N}]/gu,''); const g=new Set(); for(let i=0;i<s.length-1;i++) g.add(s.slice(i,i+2)); return g; };
const sim = (a,b) => { const A=grams(a),B=grams(b); if(!A.size||!B.size) return 0; let x=0; A.forEach(g=>B.has(g)&&x++); return x/(A.size+B.size-x); };
const AI = {
  comp(r){ const all=sortedMembers(r).map(([,m])=>(m.major||'').trim()).filter(Boolean), key=x=>x.replace(/\s/g,'').replace(/(학부|전공|과)$/,'');
    return {kind: new Set(all.map(key)).size<=1?'same':'mixed', majors:uniq(all)}; },
  hint(r, i){ const c=this.comp(r); const others=sortedMembers(r).filter(([u])=>u!==ME).map(([,m])=>m.major).filter(Boolean);
    const pool=[...TT(r).hints, ...COMP_HINTS[c.kind].map(q=>({q:q.replace('{major}', others[i%Math.max(1,others.length)]||'다른 전공'), tag:c.kind==='same'?'동일 전공 팀':'융합 전공 팀'}))];
    return pool[i%pool.length]; },
  why(chain){ if(!chain.length) return '이 과제에서 가장 해결하고 싶은 문제는 무엇인가요?';
    const last=chain.at(-1).a.trim(); const s=last.length>28?last.slice(0,28)+'…':last;
    return ['왜 「'+s+'」라고 생각하나요?','그 이유가 생긴 원인은 무엇일까요?','그렇다면 그 원인은 왜 계속 남아 있을까요?','결국 가장 바꾸고 싶은 한 가지는 무엇인가요?'][Math.min(chain.length-1,3)]; },
  analyze(r){
    const cards=Object.entries(r.cards||{}).map(([id,c])=>({id,...c})).sort((a,b)=>a.at-b.at);
    if(!cards.length) return {cards,A:[],B:[],kw:[],avg:0};
    const n=cards.length, S=cards.map((a,i)=>cards.map((b,j)=>i===j?0:sim(a.text,b.text)));
    cards.forEach((c,i)=>c.s=n>1?S[i].reduce((x,y)=>x+y,0)/(n-1):0);
    const df={}; cards.forEach(c=>new Set(words(c.text)).forEach(w=>df[w]=(df[w]||0)+1));
    const kw=Object.entries(df).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w])=>w);
    cards.forEach(c=>{ const ws=new Set(words(c.text)); c.k=kw.filter(w=>ws.has(w)).length; c.score=c.s+c.k*0.08; });
    const seed=cards.slice().sort((a,b)=>b.score-a.score)[0];
    let A=cards.filter(c=>c===seed || sim(c.text,seed.text)>=0.16 || (c.k>=1 && seed.k>=1 && words(c.text).some(w=>words(seed.text).includes(w))));
    if(A.length>Math.ceil(n*0.7)) A=A.sort((a,b)=>b.score-a.score).slice(0,Math.ceil(n*0.6));
    const B=cards.filter(c=>!A.includes(c)).sort((a,b)=>a.score-b.score).slice(0,3);
    const avg=n>1?cards.reduce((x,c)=>x+c.s,0)/n:0;
    return {cards,A,B,kw,avg,seed};
  },
  short(t,n=20){ t=(t||'').trim(); return t.length>n?t.slice(0,n)+'…':t; },
  counter(b){ return `「${this.short(b.text,24)}」 의견을 기존 방향에 반영하면 무엇이 달라질까요? 반영하지 않으면 무엇을 놓칠까요?`; },
  counterA(seed){ return `「${this.short(seed.text,24)}」 쪽으로 의견이 모였어요. 모두가 쉽게 동의한 이유는 무엇이고, 빠진 관점은 없을까요?`; },
  recommend(r){
    const roles=TT(r).roles, mem=sortedMembers(r), load=Object.fromEntries(mem.map(([u])=>[u,0])), out={};
    const score=(m,[name,,trait])=>(m.trait===trait?3:0)+((m.wants||[]).includes(name)?3:0)+((m.skills||'').split(/[,\s]+/).some(s=>s&&name.includes(s.slice(0,2)))?2:0);
    roles.slice().sort((a,b)=>b[1]-a[1]).forEach(role=>{
      const best=mem.map(([u,m])=>({u,v:score(m,role)-load[u]*0.6})).sort((a,b)=>b.v-a.v)[0]; if(!best) return;
      out[role[0]]=best.u; load[best.u]+=role[1]; });
    return out; },
  reason(m,[name,,trait]){ const r=[]; if(m.trait===trait) r.push(`${trait} 성향`); if((m.wants||[]).includes(name)) r.push('희망 역할'); if((m.skills||'').split(/[,\s]+/).some(s=>s&&name.includes(s.slice(0,2)))) r.push('보유 역량'); return r.join(', ')||'업무량 균형'; },
  plan(r){ const P=TT(r).plan, rec=this.recommend(r), start=today(), end=r.deadline&&r.deadline>start?r.deadline:addDays(start,14);
    const span=Math.max(1,(new Date(end)-new Date(start))/864e5), n=P.length, out={};
    P.forEach(([title,role],i)=>{ out['t'+i]={title,role,who:rec[role]||'',due:addDays(start,Math.max(1,Math.round(span*(i+1)/n))),status:0,i}; });
    return out; }
};

function critEditor(list, onChange, id){
  const box=$('#'+id);
  const draw=()=>{ box.innerHTML = `<div class="opt">${list.map((c,i)=>`<span class="chip p" style="font-size:13px;padding:5px 6px 5px 10px">${esc(c)}<button type="button" class="x" data-rm="${i}" aria-label="${esc(c)} 삭제">×</button></span>`).join('')}</div>
    <div class="row" style="margin-top:8px"><label for="${id}In" class="sr">평가 기준 추가</label><input id="${id}In" class="grow" maxlength="20" placeholder="기준 추가 (예: 근거의 구체성)" autocomplete="off"><button type="button" id="${id}Add">추가</button></div>`;
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ if(list.length<=1) return toast('평가 기준은 1개 이상 필요해요'); list.splice(+b.dataset.rm,1); onChange(list); draw(); });
    const add=()=>{ const v=$('#'+id+'In').value.trim(); if(!v) return; if(list.includes(v)) return toast('이미 있는 기준이에요'); if(list.length>=6) return toast('평가 기준은 6개까지 둘 수 있어요'); list.push(v); onChange(list); draw(); $('#'+id+'In').focus(); };
    $('#'+id+'Add').onclick=add; $('#'+id+'In').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } }; };
  draw();
}

  return `<div class="card"><div class="row sp"><h3>팀원 ${members().length}명</h3><span class="chip ${c.kind==='same'?'w':'p'}">${c.kind==='same'?'동일 전공 팀':'융합 전공 팀'}</span></div>
  <div class="who-list" style="margin-top:8px">${members().map(([u,m])=>`<div class="m">${av(u)}<div><b>${esc(m.name)}</b>${u===R.hostId?' <span class="xs sub">(리더)</span>':''}<div class="xs sub">${esc(m.major)}, ${esc(m.trait)}</div></div></div>`).join('')}</div></div>`; }
function recBox(){ const roles=TT(R).roles, rec=AI.recommend(R), mineR=roles.filter(r=>rec[r[0]]===ME);
  return `<div class="card"><h3>역할 추천</h3>
    ${mineR.length?`<p style="margin:4px 0 10px">나에게 추천: <b>${mineR.map(r=>esc(r[0])).join(', ')}</b></p>`:''}
    <table><thead><tr><th>역할</th><th>예상 시간</th><th>추천</th></tr></thead><tbody>
    ${roles.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${r[1]}시간</td><td>${rec[r[0]]?`<div class="row">${av(rec[r[0]])}${esc(mName(rec[r[0]]))}</div><div class="xs sub" style="margin-top:4px">${AI.reason(R.members[rec[r[0]]]||{},r)}</div>`:'-'}</td></tr>`).join('')}
    </tbody></table></div>`; }
function viewLobby(){
  const link = location.origin+location.pathname+`?r=${CODE}${LOCAL&&Remote?'&local=1':''}`;
  $('#app').innerHTML = `
  <h1>${esc(R.name)}</h1><p class="sub">${esc(R.topic)}</p>
  <div class="card"><h3>팀원 초대</h3>
    <div class="row sp" style="margin:10px 0"><span class="code" aria-label="초대 코드">${CODE}</span><button id="cp">초대 링크 복사</button></div>
    ${navigator.share?'<button class="ghost" id="sh">공유하기…</button>':''}</div>
  ${teamBox()}
  ${members().length?recBox():''}
  ${isHost()?`<div class="card"><h3>평가 기준</h3><div id="critL" style="margin-top:6px"></div></div>`:''}`;
  $('#cp').onclick=()=>copy(link); $('#sh')&&($('#sh').onclick=()=>navigator.share({title:'POPCORN 초대',text:`${R.name} 팀 프로젝트에 참여해 주세요`,url:link}).catch(()=>{}));
  if(isHost()){ const cl=critOf(R).slice(); critEditor(cl, l=>up({crit:l.slice()}), 'critL'); }
  bar(isHost()?`<span class="msg">${members().length<2?'팀원이 2명 이상이면 시작할 수 있어요':''}</span><button class="pri" id="go" ${members().length<2?'disabled':''}>POP 시작</button>`:`<span class="msg"></span>`);
  $('#go')&&($('#go').onclick=()=>{ const now=Date.now(); up({phase:'in',phaseAt:now,popEnd:now+(R.popMin||10)*60000}); });
}

/* ---------- POP: 아이디어 발산 ---------- */
function viewIn(){
  const mine=myCards(), all=Object.values(R.cards||{}), per=R.per||1, h=AI.hint(R,ui.hintI), done=mine.length>=per;
  const cnt=u=>all.filter(c=>c.by===u).length, readyN=members().filter(([u])=>cnt(u)>=per).length;
  const end=R.popEnd||0, left=()=>end?end-Date.now():Infinity, over=left()<=0;
  $('#app').innerHTML = `
  <h1>${esc(R.topic)}</h1>
  <div class="card" id="popStatus">${popStatus()}</div>
  <form class="card" id="fc" novalidate>
    <div class="row sp"><h3>내 아이디어 카드 <span class="sub">${mine.length}장 (최소 ${per}장)</span></h3></div>
    <fieldset ${over?'disabled':''} style="border:0;padding:0;margin:0">
    <label for="ct">아이디어 한 줄</label><input id="ct" maxlength="120" value="${esc(ui.draft)}" placeholder="예: 기여도를 매주 자동으로 기록해 보여준다" autocomplete="off">
    <label for="cw">이유 한 줄 <span class="xs sub">(선택)</span></label><input id="cw" maxlength="120" value="${esc(ui.why)}" placeholder="왜 그렇게 생각했나요?" autocomplete="off">
    <button class="pri wide" style="margin-top:12px" type="submit">카드 추가</button></fieldset>
    ${mine.map(([id,c])=>`<div class="idea row sp"><div class="grow"><div class="t">${esc(c.text)}</div>${c.why?`<div class="w">${esc(c.why)}</div>`:''}</div>${over?'':`<button type="button" class="ghost" data-del="${id}" aria-label="카드 삭제">삭제</button>`}</div>`).join('')}
  </form>
  ${over?'':`<section class="card ai" aria-label="시즈닝 질문">
    <div class="who">시즈닝 질문</div>
    <p style="font-weight:600">${esc(h.q)}</p>
    <button type="button" class="ghost" id="nh">다른 질문 보기</button>
  </section>
  <section class="card ai" aria-label="생각 파고들기">
    <div class="who">생각 파고들기 (5 Whys)</div>
    ${ui.chain.map((s,i)=>`<div class="sm" style="margin:6px 0"><span class="sub">Q${i+1}. ${esc(s.q)}</span><br>${esc(s.a)}</div>`).join('')}
    ${ui.chain.length<5?`<form id="fw" class="row" novalidate style="margin-top:8px"><label for="wa" style="margin:0;width:100%">Q${ui.chain.length+1}. ${esc(AI.why(ui.chain))}</label><input id="wa" class="grow" autocomplete="off" placeholder="떠오르는 대로 답해 보세요"><button type="submit">답하기</button></form>`:''}
    ${ui.chain.length?'<button type="button" class="ghost" id="wr">처음부터 다시</button>':''}
  </section>`}`;
  $('#ct').oninput=e=>{ui.draft=e.target.value;saveUi();}; $('#cw').oninput=e=>{ui.why=e.target.value;saveUi();};
  $('#fc').onsubmit=async e=>{ e.preventDefault(); if(left()<=0) return toast('발산 시간이 끝났어요'); const t=ui.draft.trim(); if(!t){ toast('아이디어를 한 줄 적어 주세요'); $('#ct').focus(); return; }
    const id='c'+rid(8,'abcdefghijkmnpqrstuvwxyz23456789'); ui.draft='';ui.why='';saveUi();
    await up({[`cards.${id}`]:{text:t,why:$('#cw').value.trim(),by:ME,at:Date.now()}}); render(true); $('#ct')?.focus(); };
  on('[data-del]','click',e=>up({[`cards.${e.currentTarget.dataset.del}`]:null}));
  $('#nh')&&($('#nh').onclick=()=>{ui.hintI++;saveUi();render(true);});
  $('#fw')&&($('#fw').onsubmit=e=>{ e.preventDefault(); const a=$('#wa').value.trim(); if(!a) return; ui.chain.push({q:AI.why(ui.chain),a}); saveUi(); render(true); $('#wa')?.focus(); });
  $('#wr')&&($('#wr').onclick=()=>{ui.chain=[];saveUi();render(true);});
  if(!over && end){ tickH=setInterval(()=>{ const l=left(); if(l<=0){ clearInterval(tickH); render(true); return; } const el=$('#tm'); if(el) el.textContent=fmt(l); },1000); }
  bar(isHost()?`<button id="ext">5분 연장</button><span class="msg">${readyN<members().length?`${members().length-readyN}명이 아직 작성 중이에요`:'모두 작성했어요'}</span><button class="pri" id="go" ${all.length<2?'disabled':''}>${readyN<members().length&&!over?'그래도 공개':'아이디어 공개하기'}</button>`
    :`<span class="msg">${over?'리더가 공개하면 넘어가요':done?'다 썼어요':'아이디어를 '+(per-mine.length)+'장 더 써 주세요'}</span>`);
  $('#ext')&&($('#ext').onclick=()=>{ up({popEnd:Math.max(Date.now(),end)+5*60000}); toast('5분 연장했어요'); });
  $('#go')&&($('#go').onclick=e=>{ const b=e.currentTarget; if(readyN<members().length&&!over&&!b.dataset.ok){ b.dataset.ok=1; b.textContent='한 번 더 누르면 공개'; return; } up({phase:'sync',phaseAt:Date.now()}); });
}
function popStatus(){ const all=Object.values(R.cards||{}), per=R.per||1, cnt=u=>all.filter(c=>c.by===u).length, readyN=members().filter(([u])=>cnt(u)>=per).length;
  const end=R.popEnd||0, l=end?end-Date.now():Infinity, over=l<=0;
  return `<div class="row sp"><b>제출 현황</b><span class="sm sub">카드 ${all.length}장, 다 쓴 사람 ${readyN}/${members().length}명</span></div>
    <div class="row sp" style="margin:10px 0 6px"><span class="sm">${over?'시간이 끝났어요':'남은 시간'}</span><span id="tm" style="font-weight:700;font-size:20px;font-variant-numeric:tabular-nums">${over?'0:00':end?fmt(l):'-'}</span></div>
    <div class="who-list">${members().map(([u,m])=>`<span class="chip ${cnt(u)>=per?'ok':''}">${esc(m.name)} ${cnt(u)}장</span>`).join('')}</div>`; }
const fmt = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

/* ---------- MIX: 의견 수렴 (소수 의견 먼저) ---------- */
function viewSync(){
  const crit=critOf(R), an=AI.analyze(R), c=AI.comp(R), s=R.sync||{}, react=s.react||{}, score=s.score||{};
  const research=typesOf(R).includes('research');
  const evid = x => research ? (x.why&&x.why.length>=6?'<span class="chip ok">근거 있음</span>':'<span class="chip w">근거 필요</span>') : '';
  const seg = key => { const r=react[key]||{}, y=Object.values(r).filter(v=>v==='y').length, hh=Object.values(r).filter(v=>v==='h').length;
    return `<div class="seg" role="group" aria-label="반영 여부" style="margin-top:10px"><button type="button" data-rx="${key}" data-v="y" aria-pressed="${r[ME]==='y'}">반영해 보자<span class="n">${y}</span></button><button type="button" data-rx="${key}" data-v="h" aria-pressed="${r[ME]==='h'}">보류<span class="n">${hh}</span></button></div>`; };
  const cands=[...an.B.map(b=>[b.id,b.text,'소수']),...(an.seed?[['A',an.seed.text,'다수']]:[])];
  const tot=k=>Object.values(score[k]||{}).reduce((a,v)=>a+v.filter(Boolean).length,0);
  const best=cands.slice().sort((a,b)=>tot(b[0])-tot(a[0]))[0];
  $('#app').innerHTML = `
  <h1>아이디어 ${an.cards.length}장이 모였어요</h1>
  <div class="card ai"><div class="who">융합 협업 가이드</div>
    ${c.kind==='same'?`아이디어 유사도가 ${Math.round(an.avg*100)}%예요. 같은 전공의 익숙한 틀에서 나왔을 수 있으니 소수 의견부터 이야기해 보세요.`
      :`${c.majors.map(esc).join(', ')} 전공이 모였어요. 낯선 용어가 있는 카드는 작성자가 한 줄로 풀어 설명하고, 전공 사이의 접점을 찾아보세요.`}</div>
  <section class="card sec b"><div class="row sp"><h3><span class="k">B</span>소수 의견</h3><span class="sm sub">${an.B.length}장</span></div>
    ${an.B.length?an.B.map(b=>`<div class="idea"><div class="t">${esc(b.text)}</div>${b.why?`<div class="w">${esc(b.why)}</div>`:''}${evid(b)}
      <div class="sm" style="margin-top:8px"><b>생각해 볼 질문</b> ${esc(AI.counter(b))}</div>${seg(b.id)}</div>`).join(''):'<p class="sub sm">모든 아이디어가 비슷한 방향이에요.</p>'}</section>
  <section class="card sec"><div class="row sp"><h3><span class="k">A</span>다수 의견</h3><span class="sm sub">${an.A.length}장</span></div>
    ${an.A.map(x=>`<div class="idea"><div class="t">${esc(x.text)}</div>${x.why?`<div class="w">${esc(x.why)}</div>`:''}${evid(x)}</div>`).join('')}
    ${an.seed?`<div class="sm" style="margin-top:10px"><b>생각해 볼 질문</b> ${esc(AI.counterA(an.seed))}</div>${seg('A')}`:''}</section>
  <section class="card"><h3>후보 평가</h3>
    ${cands.map(([k,t,kind])=>`<div class="idea"><div class="row sp"><span class="chip ${kind==='소수'?'w':'p'}">${kind} 의견</span><span class="xs sub">충족 ${tot(k)}표</span></div><div class="t" style="margin-top:6px">${esc(t)}</div>
      <div class="crit">${crit.map((cr,i)=>`<button type="button" data-sc="${k}" data-i="${i}" aria-pressed="${!!(score[k]?.[ME]?.[i])}">${esc(cr)}</button>`).join('')}</div>
      ${isHost()?`<button class="ghost" data-fin="${k}" style="margin-top:6px">이 안으로 최종 확정</button>`:''}</div>`).join('')}</section>
  ${s.final?`<div class="card final"><h3>최종 아이디어</h3><p style="font-weight:700;font-size:17px;margin-top:4px">${esc(s.final.text)}</p></div>`:''}`;
  on('[data-rx]','click',e=>{ const {rx,v}=e.currentTarget.dataset; up({[`sync.react.${rx}.${ME}`]: react[rx]?.[ME]===v?null:v}); });
  on('[data-sc]','click',e=>{ const {sc,i}=e.currentTarget.dataset; const cur=(score[sc]?.[ME]||crit.map(()=>false)).slice(); while(cur.length<crit.length) cur.push(false); cur[+i]=!cur[+i]; up({[`sync.score.${sc}.${ME}`]:cur}); });
  on('[data-fin]','click',e=>{ const k=e.currentTarget.dataset.fin; up({'sync.final':{key:k,text:cands.find(x=>x[0]===k)[1]}}); toast('최종 아이디어로 확정했어요'); });
  bar(isHost()?`<span class="msg">${s.final?'최종 아이디어를 정했어요':(best&&tot(best[0])?`지금 가장 높은 후보는 ${best[2]} 의견이에요`:'')}</span><button class="pri" id="go" ${s.final?'':'disabled'}>RUN 시작</button>`
    :`<span class="msg">${s.final?'최종 아이디어가 확정됐어요':''}</span>`);
  $('#go')&&($('#go').onclick=()=>up({phase:'up',phaseAt:Date.now(),tasks:AI.plan(R)}));
}

/* ---------- RUN: 협업 실행 ---------- */
const ST=['할 일','진행 중','완료'];
function viewUp(){
  const tasks=Object.entries(R.tasks||{}).sort((a,b)=>(a[1].due||'').localeCompare(b[1].due||'')||a[1].i-b[1].i);
  const done=tasks.filter(([,t])=>t.status===2).length, pct=tasks.length?Math.round(done/tasks.length*100):0;
  const mine=tasks.filter(([,t])=>t.who===ME&&t.status!==2);
  const dleft = R.deadline ? Math.ceil((new Date(R.deadline)-new Date(today()))/864e5) : null;
  $('#app').innerHTML = `
  <h1>${esc(R.sync?.final?.text||R.topic)}</h1>
  <div class="card"><div class="row sp"><b>전체 진행률 ${pct}%</b><span class="sm sub">${done}/${tasks.length}개 완료${dleft!=null?`, 마감까지 ${dleft>=0?dleft+'일':'지남'}`:''}</span></div>
    <div class="gauge" style="margin-top:8px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>
  ${mine.length?`<div class="card final"><h3>내 할 일 ${mine.length}개</h3>${mine.map(([,t])=>`<div class="sm" style="margin-top:6px">${esc(t.title)} <span class="sub">${md(t.due)}까지</span></div>`).join('')}</div>`:''}
  <div class="card" style="padding:8px 12px"><table><thead><tr><th>업무</th><th>담당</th><th>마감</th><th>상태</th></tr></thead><tbody>
  ${tasks.map(([id,t])=>`<tr><td><b class="sm">${esc(t.title)}</b>${t.role?`<div class="xs sub">${esc(t.role)}</div>`:''}</td>
    <td><label class="sr" for="w${id}">담당</label><select id="w${id}" data-who="${id}" style="min-height:36px;padding:6px;font-size:13px;min-width:84px"><option value="">미배정</option>${members().map(([u,m])=>`<option value="${u}" ${t.who===u?'selected':''}>${esc(m.name)}</option>`).join('')}</select></td>
    <td class="sm" style="white-space:nowrap">${t.due?md(t.due):'-'}</td>
    <td><button class="status s${t.status}" data-st="${id}" aria-label="${esc(t.title)} 상태: ${ST[t.status]}. 눌러서 변경">${ST[t.status]}</button></td></tr>`).join('')}
  </tbody></table>
  <form id="fa" class="row" style="margin:10px 0 4px" novalidate><label for="na" class="sr">업무 추가</label><input id="na" class="grow" placeholder="업무 추가" autocomplete="off"><input id="nd" type="date" style="width:auto" value="${R.deadline||addDays(today(),7)}" aria-label="마감일"><button type="submit">추가</button></form></div>
  <div class="card"><h3>팀원별 진행</h3>${members().map(([u,m])=>{ const my=tasks.filter(([,t])=>t.who===u), d=my.filter(([,t])=>t.status===2).length;
    return `<div class="row" style="margin:8px 0">${av(u)}<span style="width:64px" class="sm">${esc(m.name)}</span><div class="gauge grow"><i style="width:${my.length?d/my.length*100:0}%"></i></div><span class="sm sub" style="width:44px;text-align:right">${d}/${my.length}</span></div>`; }).join('')}</div>`;
  on('[data-st]','click',e=>{ const id=e.currentTarget.dataset.st; up({[`tasks.${id}.status`]:((R.tasks[id].status||0)+1)%3}); });
  on('[data-who]','change',e=>up({[`tasks.${e.target.dataset.who}.who`]:e.target.value}));
  $('#fa').onsubmit=e=>{ e.preventDefault(); const t=$('#na').value.trim(); if(!t) return $('#na').focus(); up({[`tasks.t${rid(6,'abcdefghijkmnpqrstuvwxyz23456789')}`]:{title:t,role:'',who:'',due:$('#nd').value,status:0,i:99}}); $('#na').value=''; $('#na').blur(); };
  bar(`<span class="msg">${pct===100?'모든 업무를 마쳤어요':''}</span>${isHost()?'<button id="bk">아이디어 다시 보기</button>':''}`);
  $('#bk')&&($('#bk').onclick=e=>{ const b=e.currentTarget; if(!b.dataset.ok){ b.dataset.ok=1; b.textContent='한 번 더 누르면 이동'; return; } up({phase:'sync'}); });
}

/* ---------- 시뮬레이션 (기획서 5장: 동일 전공 vs 융합 전공) ---------- */

  const topic='대학생 팀플 무임승차를 줄이는 서비스 기획', code='D'+rid(5);

    : [['김동현','법학과','자료조사, 글쓰기','정리형',['실행 전략']],['정종엽','사회복지상담학과','인터뷰, 상담','발표형',['타깃 리서치','피칭·발표']],['남예원','화학과','실험설계, 디자인','실행형',['시각 자료 제작']]];
  const cards = kind==='same'
    ? [['기여도를 점수로 매겨 성적에 반영한다','점수가 있어야 움직인다'],['팀원끼리 기여도 점수를 매기는 상호평가','교수님이 다 볼 수 없다'],['기여도 점수를 매주 공개한다','늦게 알면 바로잡을 수 없다'],['역할별 기여 점수를 자동 계산한다','공정한 기준이 필요하다'],['상호평가 점수를 익명으로 매긴다','눈치 보지 않게'],['무임승차한 팀원을 교수님께 신고하는 기능','최후의 수단'],['첫 회의에서 각자 하기 싫은 일을 먼저 말하게 한다','싫은 일이 빈칸으로 남는다'],['기여도 점수를 성적 일부로 반영한다','동기 부여'],['기여 점수가 낮으면 알림을 준다','']]
    : [['팀원이 서로 기여를 증언하는 상호평가 기록','법적 분쟁도 증거가 핵심이다'],['무임승차 원인을 면담으로 먼저 듣는 상담 단계','게으름이 아니라 사정일 수 있다'],['실험 노트처럼 작업 과정을 날짜별로 남긴다','과정이 남아야 기여가 보인다'],['역할별 기여를 점수화해 공개한다','투명하면 줄어든다'],['처음에 팀 규칙을 계약서처럼 서명한다','약속이 있어야 책임이 생긴다'],['참여가 적은 팀원에게 작은 일부터 맡긴다','진입 장벽을 낮춘다'],['기여 기록을 교수에게 제출하는 기능','평가 근거가 된다'],['팀원 상태를 체크하는 익명 기분 설문','소진을 미리 알 수 있다'],['작업 과정을 사진으로 기록해 공유','']];
  const t0=Date.now(), M={}, C={};
  ppl.forEach(([name,major,skills,trait,wants],i)=>{ const u='demo'+i; M[u]={name,major,skills,trait,wants,scores:{[trait]:3},joinedAt:t0+i};
    cards.slice(i*3,i*3+3).forEach(([text,why],j)=>C['c'+i+j]={text,why,by:u,at:t0+i*10+j}); });
  M[ME]={name:'나',major:kind==='same'?'경영학과':'AI융합학부',skills:'기획, 개발',trait:'아이디어형',wants:['콘셉트 기획'],scores:{},joinedAt:t0+9};
  await Local.create(code,{v:3,sim:true,name:kind==='same'?'시뮬레이션: 동일 전공 팀':'시뮬레이션: 융합 전공 팀',topic,types:['plan'],crit:TYPES.plan.crit.slice(),deadline:addDays(today(),14),per:3,popMin:10,popEnd:t0+10*60000,hostId:ME,createdAt:t0,phase:'in',phaseAt:t0,members:M,cards:C});
  go(code,true);
}

/* ================== 시작 ================== */
const recent = () => (ls.get('link.recent')||[]).filter(x=>!x.sim&&!x.local);
const remember = () => { if(!R?.members?.[ME]||R.sim) return; const list=(ls.get('link.recent')||[]).filter(x=>x.code!==CODE); list.unshift({code:CODE,name:R.name,local:LOCAL&&!!Remote,at:Date.now()}); ls.set('link.recent',list.slice(0,8)); };
if(CODE){ unsub=db().subscribe(CODE, d=>{ const ph=R?.phase; R=d; remember(); render(ph!==d?.phase); }); setTimeout(()=>{ if(R===null && $('#app').textContent.includes('불러오는')) render(true); },10000); }
else render(true);
</script>
