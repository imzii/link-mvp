<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINK — 생각은 자유롭게, 협업은 유기적으로</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e3e1dc;
    --accent:#2f5bea; --accent-soft:#e8eefe; --good:#1f8a5b; --warn:#c77700; --bad:#c23b3b;
    --off:#8a8a8f; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(246,245,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{font-weight:800;letter-spacing:.08em;font-size:18px;cursor:pointer}
  .logo small{font-weight:500;letter-spacing:0;color:var(--sub);font-size:12px;margin-left:6px}
  .steps{display:flex;gap:4px;margin-left:auto}
  .step{font-size:12px;padding:4px 9px;border-radius:999px;color:var(--sub);border:1px solid var(--line);background:#fff}
  .step.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .step.done{color:var(--ink)}
  .light{font-size:12px;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line)}
  .light i{width:9px;height:9px;border-radius:50%;display:inline-block}
  main{max-width:880px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:24px;margin:8px 0 4px}
  h2{font-size:19px;margin:24px 0 8px}
  h3{font-size:16px;margin:16px 0 6px}
  p{margin:6px 0}
  .muted{color:var(--sub)}
  .small{font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .hero{padding:28px 20px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}.steps{margin-left:0}}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  textarea{min-height:70px;resize:vertical}
  button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#fff;padding:9px 14px;cursor:pointer}
  button:hover{border-color:#bbb}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:disabled{background:#b7c4f2;border-color:#b7c4f2;cursor:not-allowed}
  button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
  button.danger{color:var(--bad)}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .pill.gray{background:#efeee9;color:var(--sub)}
  .pill.good{background:#e4f4ec;color:var(--good)}
  .pill.warn{background:#fdf1df;color:var(--warn)}
  .pill.bad{background:#fbe7e7;color:var(--bad)}
  .gauge{height:12px;background:#ecebe6;border-radius:999px;overflow:hidden}
  .gauge>div{height:100%;background:var(--accent);transition:width .4s}
  .big{font-size:22px;font-weight:700;line-height:1.4}
  .ai{border-left:4px solid var(--warn);background:#fffaf1}
  .ai .who{font-size:12px;color:var(--warn);font-weight:700;margin-bottom:4px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  th{color:var(--sub);font-weight:600;font-size:12px}
  .chk{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:0 8px;white-space:nowrap;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
  .chk.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .codebox{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.95}
  .bucket{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
  .bar-h{height:10px;border-radius:999px;background:var(--accent)}
  details summary{cursor:pointer;color:var(--accent);font-size:13px}
  .note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
  .ideacard{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#fcfcfb}
  @media print{header,.noprint{display:none!important}body{background:#fff}.card{border:none;padding:0}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" onclick="go('')">LINK<small>생각은 자유롭게, 협업은 유기적으로</small></div>
  <div class="steps" id="steps"></div>
  <div class="light" id="light"></div>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ===================== 공통 유틸 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = obj => btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec = str => { let s = str.trim().replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); };
const rid = (n=6) => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
const now = () => Date.now();
const fmtTime = ms => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast('복사했어요'); } catch(e){ toast('자동 복사가 막혀 있어요. 직접 선택해서 복사해 주세요'); } }
// 결정적 셔플 (세션 id 기반) — 새로고침해도 순서 유지
function seeded(seedStr){ let h=2166136261; for (const c of seedStr) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return () => { h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; }; }
function shuffle(arr, seed){ const r=seeded(seed), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ===================== 상수 ===================== */
const CHECKS = [
  {k:'new',  label:'처음 보는 관점이다',        short:'처음'},
  {k:'merge',label:'다른 의견과 합치면 좋겠다',  short:'합치기'},
  {k:'more', label:'무슨 뜻인지 더 듣고 싶다',   short:'더 듣기'},
  {k:'diff', label:'나는 다르게 생각한다',       short:'다르게'},
  {k:'worry',label:'걱정되는 점이 있다',         short:'걱정'}
];
const REDPEN = [
  {crit:'현실 연결', q: idea => `「${idea}」가 우리 팀의 실제 조건(시간·인원·마감)에서 작동하지 않는 경우는 언제일까요?`},
  {crit:'가치',     q: idea => `「${idea}」가 없어도 사용자가 크게 불편하지 않다면, 이 아이디어가 해결하는 진짜 문제는 무엇일까요?`},
  {crit:'창의적 변수', q: idea => `카톡 투표나 구글폼 같은 기존 방식으로도 「${idea}」를 똑같이 할 수 있다면, 무엇이 새로운가요?`}
];
const PHASES = {collect:'IN', review:'SYNC', prep:'SYNC', clash:'SYNC', vote:'SYNC', match:'MATCH', report:'UP'};
const LIGHTS = {
  collect:{c:'var(--off)',  t:'AI 꺼짐 · 지금은 사람이 생각할 차례'},
  join:   {c:'var(--off)',  t:'AI 꺼짐 · 지금은 당신이 생각할 차례'},
  review: {c:'#e0b100',     t:'AI 질문만 · 답은 내지 않아요'},
  prep:   {c:'#e0b100',     t:'AI 질문만 · 답은 내지 않아요'},
  clash:  {c:'var(--warn)', t:'AI 반론 · 빨간 펜'},
  vote:   {c:'var(--warn)', t:'AI 반론 · 쏠림 감시'},
  match:  {c:'var(--accent)',t:'AI 추천 · 확정은 팀이'},
  report: {c:'var(--good)', t:'AI 기록 · 생각의 출처'}
};

/* ===================== 라우팅 ===================== */
let S = null;            // 진행자 세션 상태
let timerH = null;
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', route);
function route(){
  clearInterval(timerH);
  const h = location.hash.slice(1);
  if (h.startsWith('join=')) return viewJoin(h.slice(5));
  if (h.startsWith('host=')) { S = store.get('link:'+h.slice(5)); if (S) return renderHost(); }
  if (h === 'new') return viewNew();
  S = null; viewHome();
}
function setChrome(phase){
  const order = ['IN','SYNC','MATCH','UP'];
  const cur = phase ? (PHASES[phase] || (phase==='join'?'IN':null)) : null;
  const ci = order.indexOf(cur);
  $('#steps').innerHTML = order.map((s,i)=>`<span class="step ${i===ci?'on':(ci>i?'done':'')}">LINK ${s}</span>`).join('');
  const L = LIGHTS[phase];
  $('#light').style.display = L ? '' : 'none';
  if (L) $('#light').innerHTML = `<i style="background:${L.c}"></i>${L.t}`;
}
function save(){ if (S) store.set('link:'+S.session.id, S); }
function log(ev){ S.log.push({t:now(), ev}); }

/* ===================== 홈 ===================== */
function viewHome(){
  setChrome(null);
  const recent = Object.keys(localStorage).filter(k=>k.startsWith('link:')).map(k=>store.get(k)).filter(Boolean).sort((a,b)=>b.session.createdAt-a.session.createdAt).slice(0,5);
  $('#app').innerHTML = `
  <div class="card hero">
    <span class="pill">대학생 팀플용 · 설치 없이 링크로</span>
    <h1>AI보다 먼저, 우리 생각부터.</h1>
    <p class="muted">LINK는 팀 회의를 <b>IN(블라인드 발산) → SYNC(소수 의견부터 검토 + 반론) → MATCH(역할) → UP(기여 기록)</b> 순서로 진행해요. AI는 팀원의 생각이 다 나온 뒤에 질문과 반론으로만 등장해요.</p>
    <div class="row" style="margin-top:14px">
      <button class="primary" onclick="go('new')">새 회의 세션 만들기 (진행자)</button>
      <button onclick="startDemo()">데모 데이터로 바로 체험</button>
    </div>
  </div>
  <div class="grid2">
    <div class="card"><h3>팀원이라면</h3><p class="muted small">진행자가 카톡에 올린 참여 링크를 열면 돼요. 앱 설치도, 가입도 필요 없어요. 다 쓰면 나오는 <b>제출 코드</b>를 카톡방에 붙여 넣으면 끝.</p></div>
    <div class="card"><h3>교수님·조교라면</h3><p class="muted small">회의가 끝나면 UP 단계에서 <b>기여 기록 리포트</b>가 만들어져요. 누가 얼마나 생각을 냈고, 검토에 참여했고, 어떤 역할을 맡았는지 팀 대표가 PDF로 제출할 수 있어요.</p></div>
  </div>
  ${recent.length ? `<div class="card"><h3>이 기기에서 진행한 세션</h3>${recent.map(r=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>${esc(r.session.topic)} <span class="pill gray">${PHASES[r.phase]||''}</span></span><button class="ghost" onclick="go('host=${r.session.id}')">열기</button></div>`).join('')}</div>`:''}
  <p class="note">MVP 안내: 서버 없이 동작하는 시연용 버전이에요. 진행자 화면의 데이터는 이 브라우저에만 저장돼요. 'AI' 묶기·질문·반론은 데모용 규칙 기반이고, 실제 서비스에서는 LLM이 카드 내용을 읽고 생성해요.</p>`;
}

/* ===================== 세션 만들기 ===================== */
function viewNew(){
  setChrome(null);
  $('#app').innerHTML = `
  <h1>새 회의 세션</h1>
  <p class="muted">주제는 "어떻게 하면 ~할 수 있을까?(HMW)" 형태가 좋아요.</p>
  <div class="card">
    <label>회의 주제 (HMW)</label><input type="text" id="f-topic" placeholder="어떻게 하면 우리 팀 발표를 더 설득력 있게 만들 수 있을까?">
    <div class="grid2">
      <div><label>팀원 수</label><input type="number" id="f-n" value="5" min="2" max="12"></div>
      <div><label>숙고 시간(분) · 비동기면 크게</label><input type="number" id="f-min" value="10" min="1"></div>
      <div><label>1인 최소 카드 수 (전원 충족 시 공개)</label><input type="number" id="f-mincards" value="3" min="1" max="10"></div>
      <div><label>1인 투표권</label><input type="number" id="f-votes" value="2" min="1" max="5"></div>
    </div>
    <label>맡을 역할 (쉼표로 구분, MATCH 단계에서 사용)</label><input type="text" id="f-roles" value="자료조사, PPT 디자인, 발표, 보고서 작성, 일정관리">
    <div class="row" style="margin-top:16px"><button class="primary" onclick="createSession()">세션 만들기</button><button class="ghost" onclick="go('')">취소</button></div>
  </div>`;
}
function newState(session){
  return {session, phase:'collect', submissions:{}, cards:[], groups:[], order:[], reviewIdx:0, checks:{}, candidates:[], clash:{}, clashIdx:0, votes:{}, advocateSeen:false, final:null, rolesRevealed:false, assign:{}, log:[]};
}
function createSession(){
  const topic = $('#f-topic').value.trim() || $('#f-topic').placeholder;
  const session = {
    id: rid(), topic, members: +$('#f-n').value || 5, minutes: +$('#f-min').value || 10,
    minCards: +$('#f-mincards').value || 3, votes: +$('#f-votes').value || 2,
    roles: $('#f-roles').value.split(',').map(s=>s.trim()).filter(Boolean), createdAt: now()
  };
  session.deadline = session.createdAt + session.minutes*60000;
  S = newState(session); log('세션 생성'); save(); go('host='+session.id);
}
function joinLink(){
  const s = S.session;
  const payload = {id:s.id, topic:s.topic, minCards:s.minCards, deadline:s.deadline, roles:s.roles};
  return location.href.split('#')[0] + '#join=' + enc(payload);
}

/* ===================== 팀원 참여 화면 ===================== */
function viewJoin(code){
  let ses; try { ses = dec(code); } catch(e){ $('#app').innerHTML = `<div class="card">링크가 올바르지 않아요. 진행자에게 다시 받아 주세요.</div>`; return; }
  setChrome('join');
  const dk = 'link-draft:'+ses.id;
  const draft = store.get(dk) || {name:'', cards:[{idea:'',reason:''}], roles:[]};
  while (draft.cards.length < ses.minCards) draft.cards.push({idea:'',reason:''});
  const saveDraft = () => store.set(dk, draft);
  function render(){
    $('#app').innerHTML = `
    <span class="pill gray">LINK IN · 블라인드 발산</span>
    <h1>${esc(ses.topic)}</h1>
    <p class="muted">다른 팀원의 카드도, AI의 답도 보이지 않아요. 지금 떠오르는 생각을 <b>최소 ${ses.minCards}장</b> 적어 주세요. 완성된 답이 아니어도 괜찮아요.</p>
    <div class="card row" style="justify-content:space-between"><span>남은 숙고 시간</span><span class="big" id="cd">-</span></div>
    <div class="card">
      <label>이름 (기여 기록용 · 카드에는 표시되지 않아요)</label>
      <input type="text" id="j-name" value="${esc(draft.name)}" placeholder="이름">
      ${draft.cards.map((c,i)=>`
        <div class="ideacard">
          <div class="row" style="justify-content:space-between"><b>카드 ${i+1}</b>${draft.cards.length>1?`<button class="ghost danger" data-del="${i}">삭제</button>`:''}</div>
          <label>아이디어 한 줄</label><input type="text" data-i="${i}" data-f="idea" value="${esc(c.idea)}" placeholder="예: 발표 첫 장에 우리 팀이 직접 겪은 장면을 넣는다">
          <label>근거 한 줄 (왜 그렇게 생각했나요?)</label><input type="text" data-i="${i}" data-f="reason" value="${esc(c.reason)}" placeholder="예: 평가팀이 처음 10초에 공감해야 끝까지 듣는다">
        </div>`).join('')}
      <button onclick="" id="j-add">+ 카드 추가</button>
      ${ses.roles?.length ? `<label style="margin-top:16px">맡고 싶은 역할 (복수 선택 · 공개 전까지 아무도 못 봐요)</label>
        <div class="row">${ses.roles.map(r=>`<button class="chk ${draft.roles.includes(r)?'on':''}" data-role="${esc(r)}" style="padding:0 10px">${esc(r)}</button>`).join('')}</div>`:''}
    </div>
    <button class="primary" id="j-submit" style="width:100%;padding:14px">제출 코드 만들기</button>
    <div id="j-out"></div>
    <p class="note">제출 코드를 팀 카톡방에 붙여 넣으면 진행자가 모아서 한 번에 공개해요. 공개 화면에서 작성자는 표시되지 않아요. (MVP는 서버가 없어서 코드 안에 이름이 함께 들어 있어요.)</p>`;
    document.querySelectorAll('[data-f]').forEach(el => el.oninput = e => { draft.cards[+el.dataset.i][el.dataset.f] = el.value; saveDraft(); });
    $('#j-name').oninput = e => { draft.name = e.target.value; saveDraft(); };
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { draft.cards.splice(+b.dataset.del,1); saveDraft(); render(); });
    $('#j-add').onclick = () => { draft.cards.push({idea:'',reason:''}); saveDraft(); render(); };
    document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { const r=b.dataset.role; draft.roles = draft.roles.includes(r) ? draft.roles.filter(x=>x!==r) : [...draft.roles, r]; saveDraft(); render(); });
    $('#j-submit').onclick = () => {
      const cards = draft.cards.map(c=>({idea:c.idea.trim(), reason:c.reason.trim()})).filter(c=>c.idea);
      if (!draft.name.trim()) return toast('이름을 적어 주세요');
      if (cards.length < ses.minCards) return toast(`아이디어를 ${ses.minCards}장 이상 적어 주세요`);
      const code = 'LINK.' + enc({s:ses.id, n:draft.name.trim(), c:cards, r:draft.roles});
      $('#j-out').innerHTML = `<div class="card"><b>제출 코드</b><p class="muted small">아래 코드를 복사해서 팀 카톡방에 붙여 넣어 주세요.</p>
        <textarea class="codebox" readonly>${code}</textarea>
        <div class="row" style="margin-top:8px"><button class="primary" id="j-copy">복사하기</button>${navigator.share?'<button id="j-share">공유하기</button>':''}</div></div>`;
      $('#j-copy').onclick = () => copy(code);
      if ($('#j-share')) $('#j-share').onclick = () => navigator.share({text: code}).catch(()=>{});
    };
  }
  render();
  const tick = () => { const el=$('#cd'); if (!el) return; const left = ses.deadline - now(); el.textContent = left>0 ? fmtTime(left) : '마감 — 제출해 주세요'; };
  tick(); timerH = setInterval(tick, 1000);
}

/* ===================== 진행자 화면 ===================== */
function members(){ return Object.keys(S.submissions); }
function renderHost(){
  setChrome(S.phase);
  ({collect:hostCollect, review:hostReview, prep:hostPrep, clash:hostClash, vote:hostVote, match:hostMatch, report:hostReport})[S.phase]();
  window.scrollTo(0,0);
}
function setPhase(p){ S.phase = p; log('단계 이동: '+p); save(); renderHost(); }

/* ---- IN: 수집 ---- */
function hostCollect(){
  const s = S.session, subs = S.submissions, names = members();

    <div class="row"><input type="text" readonly value="${esc(joinLink())}" class="codebox" style="flex:1"><button class="primary" id="h-copy">링크 복사</button><a href="${esc(joinLink())}" target="_blank"><button>미리 보기</button></a></div>

/* 유사도 묶기 (데모용: 글자 2-gram Jaccard). 실제 서비스는 LLM 임베딩 */
function grams(t){ const s = t.replace(/[^\p{L}\p{N}]/gu,''); const g=new Set(); for(let i=0;i<s.length-1;i++) g.add(s.slice(i,i+2)); return g; }
function sim(a,b){ const A=grams(a),B=grams(b); if(!A.size||!B.size) return 0; let x=0; A.forEach(g=>{if(B.has(g))x++;}); return x/(A.size+B.size-x); }
function reveal(){
  const id = S.session.id; let cards = [];
  members().forEach(n => S.submissions[n].cards.forEach(c => cards.push({id:'c'+cards.length, idea:c.idea, reason:c.reason, author:n})));
  cards = shuffle(cards, id);
  // union-find
  const p = cards.map((_,i)=>i), f = i => p[i]===i?i:(p[i]=f(p[i]));
  for (let i=0;i<cards.length;i++) for (let j=i+1;j<cards.length;j++) if (sim(cards[i].idea, cards[j].idea) >= 0.2) p[f(i)] = f(j);
  const gm = {}; cards.forEach((c,i)=>{ const r=f(i); (gm[r] = gm[r] || []).push(c.id); });
  S.cards = cards;
  S.groups = Object.values(gm).map((ids,k)=>({id:'g'+k, cardIds:ids}));
  // 언더독 순서: 작은 묶음(드문 의견)부터
  S.order = shuffle(S.groups.map(g=>g.id), id+'o').sort((a,b)=>grp(a).cardIds.length - grp(b).cardIds.length);
  S.reviewIdx = 0; S.revealedAt = now();
  log(`동시 공개: 카드 ${cards.length}장 → 묶음 ${S.groups.length}개`);
  setPhase('review');
}
const grp = id => S.groups.find(g=>g.id===id);
const card = id => S.cards.find(c=>c.id===id);
const head = g => card(g.cardIds[0]);

/* ---- SYNC 1: 언더독 리뷰 ---- */
function hostReview(){
  const gid = S.order[S.reviewIdx], g = grp(gid), c = head(g), names = members();
  const ch = S.checks[gid] = S.checks[gid] || {};
  const allChecked = names.every(n => (ch[n]||[]).length > 0);
  const size = g.cardIds.length;
  const others = S.order.filter(x=>x!==gid); const pick = others.length ? head(grp(others[(S.reviewIdx*7+3)%others.length])) : null;
  $('#app').innerHTML = `
  <div class="row" style="justify-content:space-between"><span class="pill gray">LINK SYNC · 언더독 순서 (드문 의견부터)</span><span class="muted small">${S.reviewIdx+1} / ${S.order.length}</span></div>
  <div class="gauge" style="margin:10px 0"><div style="width:${(S.reviewIdx)/S.order.length*100}%"></div></div>
  <div class="card">
    ${size===1?'<span class="pill warn">한 명만 낸 의견</span>':`<span class="pill">비슷한 의견 ${size}개</span>`}
    <p class="big" style="margin-top:10px">${esc(c.idea)}</p>
    <p class="muted">근거: ${esc(c.reason)||'—'}</p>
    ${size>1?`<details><summary>원문 ${size}개 모두 보기 (요약·삭제하지 않아요)</summary>${g.cardIds.map(id=>`<div class="ideacard"><b>${esc(card(id).idea)}</b><br><span class="muted small">${esc(card(id).reason)}</span></div>`).join('')}</details>`:''}
  </div>
  ${pick?`<div class="card ai"><div class="who">AI 질문 (답은 주지 않아요)</div>이 카드와 「${esc(pick.idea)}」를 억지로라도 연결한다면 어떤 아이디어가 될까요?</div>`:''}
  <div class="card">
    <b>모두 체크를 남겨야 다음 카드가 열려요</b> <span class="muted small">(기명 · 복수 선택 · 가능성 먼저, 우려는 나중에)</span>
    <table style="margin-top:8px"><tr><th>팀원</th>${CHECKS.map(k=>`<th>${k.label}</th>`).join('')}</tr>
    ${names.map(n=>`<tr><td>${esc(n)}</td>${CHECKS.map((k,i)=>`<td><span class="chk ${(ch[n]||[]).includes(i)?'on':''}" data-n="${esc(n)}" data-k="${i}">${k.short}</span></td>`).join('')}</tr>`).join('')}
    </table>
  </div>
  <div class="row" style="justify-content:space-between">
    <button ${S.reviewIdx===0?'disabled':''} id="r-prev">← 이전</button>
    <button class="primary" id="r-next" ${allChecked?'':'disabled'}>${S.reviewIdx===S.order.length-1?'회의 준비 화면으로':'다음 카드 →'}</button>
  </div>`;
  document.querySelectorAll('.chk[data-n]').forEach(el => el.onclick = () => {
    const n = el.dataset.n, k = +el.dataset.k; const arr = ch[n] = ch[n] || [];
    ch[n] = arr.includes(k) ? arr.filter(x=>x!==k) : [...arr, k]; save(); renderHost();
  });
  $('#r-prev').onclick = () => { S.reviewIdx--; save(); renderHost(); };
  $('#r-next').onclick = () => { if (S.reviewIdx < S.order.length-1) { S.reviewIdx++; save(); renderHost(); } else { autoCandidates(); setPhase('prep'); } };
}
function tally(gid){ const t=[0,0,0,0,0]; Object.values(S.checks[gid]||{}).forEach(a=>a.forEach(k=>t[k]++)); return t; }
function autoCandidates(){
  const scored = S.order.map(g=>{ const t=tally(g); return {g, s:t[0]+t[1]+t[2]}; }).sort((a,b)=>b.s-a.s);
  S.candidates = scored.slice(0, Math.min(3, scored.length)).map(x=>x.g);
}

/* ---- SYNC 2: 회의 준비 ---- */
function hostPrep(){
  const half = Math.max(1, Math.ceil(members().length/2));
  const more = S.order.filter(g=>tally(g)[2] >= half);
  const split = S.order.filter(g=>{ const t=tally(g); return (t[3]+t[4])>0 && (t[0]+t[1]+t[2])>0; });
  const merge = S.order.filter(g=>tally(g)[1] > 0);
  const item = g => `<li>${esc(head(grp(g)).idea)} <span class="muted small">(${tally(g).map((v,i)=>v?CHECKS[i].short+' '+v:'').filter(Boolean).join(' · ')})</span></li>`;
  $('#app').innerHTML = `
  <span class="pill gray">LINK SYNC · 회의 준비 화면</span>
  <h1>회의는 쟁점부터 시작해요</h1>
  <div class="grid2">
    <div class="bucket"><b>작성자 설명 기회</b><p class="muted small">'더 듣고 싶다'가 절반 이상. 작성자가 원하면 1분 설명</p><ul>${more.map(item).join('')||'<li class="muted">없음</li>'}</ul></div>
    <div class="bucket"><b>토론 쟁점</b><p class="muted small">가능성과 우려가 함께 체크됨</p><ul>${split.map(item).join('')||'<li class="muted">없음</li>'}</ul></div>
    <div class="bucket"><b>연결 후보</b><p class="muted small">'합치면 좋겠다' 체크</p><ul>${merge.map(item).join('')||'<li class="muted">없음</li>'}</ul></div>
    <div class="bucket"><b>빨간 펜에 올릴 후보</b><p class="muted small">기본: 가능성 체크가 많은 3개. 바꿀 수 있어요</p>
      ${S.order.map(g=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" data-cand="${g}" ${S.candidates.includes(g)?'checked':''}> ${esc(head(grp(g)).idea)}</label>`).join('')}
    </div>
  </div>
  <div class="row" style="justify-content:space-between;margin-top:16px"><button id="p-back">← 리뷰로</button><button class="primary" id="p-go">빨간 펜 시작 →</button></div>`;

  $('#p-back').onclick = () => { S.reviewIdx = S.order.length-1; setPhase('review'); };
  $('#p-go').onclick = () => { if (!S.candidates.length) return toast('후보를 1개 이상 골라 주세요'); S.candidates = S.order.filter(g=>S.candidates.includes(g)); S.clashIdx = 0; setPhase('clash'); };
}

/* ---- SYNC 3: AI 빨간 펜 ---- */
function hostClash(){
  const gid = S.candidates[S.clashIdx], c = head(grp(gid));
  const k = S.clash[gid] = S.clash[gid] || {crit: S.clashIdx % REDPEN.length, original: c.idea, text: c.idea, agree:0, rebut:0, memo:'', outcome:null};
  const rp = REDPEN[k.crit];
  $('#app').innerHTML = `
  <div class="row" style="justify-content:space-between"><span class="pill gray">LINK SYNC · AI 빨간 펜</span><span class="muted small">후보 ${S.clashIdx+1} / ${S.candidates.length}</span></div>
  <div class="card"><p class="big">${esc(k.text)}</p><p class="muted">근거: ${esc(c.reason)||'—'}</p></div>
  <div class="card ai"><div class="who">AI 빨간 펜 · ${rp.crit} 검증 (대안은 제시하지 않아요)</div>${esc(rp.q(k.text))}</div>

    <b>팀의 응답</b> <span class="muted small">(익명으로 손을 들어 세어 주세요. 반대를 AI가 먼저 꺼냈으니 관계 갈등 없이 과업 갈등만 남아요)</span>

    </div>
    <label>재반박 메모</label><textarea id="c-memo" placeholder="반론에 대한 팀의 답을 적어 주세요">${esc(k.memo)}</textarea>
    <label>아이디어 수정 (반론을 반영해 고쳤다면)</label><input type="text" id="c-text" value="${esc(k.text)}">
    <div class="row" style="margin-top:12px">
      ${[['pass','통과','good'],['revised','수정 후 통과','warn'],['drop','탈락','bad']].map(([v,l,cl])=>`<button class="${k.outcome===v?'primary':''}" data-o="${v}">${l}</button>`).join('')}

  $('#c-memo').oninput = keep; $('#c-text').oninput = keep;
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { keep(); k.outcome = b.dataset.o; if (k.text !== k.original && k.outcome==='pass') k.outcome='revised'; log(`빨간 펜: ${k.original} → ${k.outcome}`); save(); renderHost(); });
  $('#c-prev').onclick = () => { keep(); S.clashIdx--; save(); renderHost(); };
  $('#c-next').onclick = () => { keep(); if (S.clashIdx < S.candidates.length-1) { S.clashIdx++; save(); renderHost(); } else setPhase('vote'); };
}

/* ---- SYNC 4: 투표 + 쏠림 경보 ---- */
function hostVote(){
  const names = members(), V = S.session.votes;
  const alive = S.candidates.filter(g => S.clash[g] && S.clash[g].outcome !== 'drop');
  if (!alive.length) { $('#app').innerHTML = `<div class="card">모든 후보가 탈락했어요. 회의 준비 화면에서 후보를 다시 골라 주세요.</div><button onclick="setPhase('prep')">← 회의 준비로</button>`; return; }
  const used = n => alive.reduce((a,g)=>a+((S.votes[g]||{})[n]||0),0);
  const tot = g => Object.values(S.votes[g]||{}).reduce((a,b)=>a+b,0);
  const all = alive.reduce((a,g)=>a+tot(g),0);
  const top = alive.slice().sort((a,b)=>tot(b)-tot(a))[0], low = alive.slice().sort((a,b)=>tot(a)-tot(b))[0];
  const skew = all>0 && alive.length>1 && tot(top)/all >= 0.7;

  $('#app').innerHTML = `
  <span class="pill gray">LINK SYNC · 최종 투표</span>

  ${alive.map(g=>`<tr><td>${esc(S.clash[g].text)}<div class="bar-h" style="width:${all?tot(g)/all*100:0}%;margin-top:6px"></div></td>${names.map(n=>`<td><span class="chk" data-v="${g}" data-n="${esc(n)}" data-d="1">+</span> <b>${(S.votes[g]||{})[n]||0}</b> <span class="chk" data-v="${g}" data-n="${esc(n)}" data-d="-1">−</span></td>`).join('')}<td><b>${tot(g)}</b></td></tr>`).join('')}
  </table></div>
  ${skew?`<div class="card ai"><div class="who">AI 악마의 대변인 · 한 의견에 ${Math.round(tot(top)/all*100)}% 쏠림</div>가장 적은 표를 받은 「${esc(S.clash[low].text)}」에도 타당한 근거가 있다면 무엇일까요? 결정 전에 1분만 들어 봐요.
    <div class="row" style="margin-top:8px"><button id="v-heard" ${S.advocateSeen?'disabled':''}>${S.advocateSeen?'들었어요 ✓':'1분 들었어요'}</button></div></div>`:''}
  <div class="card"><b>최종안 결정</b><div class="row" style="margin-top:8px">${alive.map(g=>`<button class="${S.final===g?'primary':''}" data-f="${g}">${esc(S.clash[g].text)}</button>`).join('')}</div></div>
  <div class="row" style="justify-content:space-between"><button id="v-back">← 빨간 펜으로</button><button class="primary" id="v-next" ${S.final && (!skew || S.advocateSeen)?'':'disabled'}>역할 정하기 →</button></div>
  ${skew && !S.advocateSeen?'<p class="small muted" style="text-align:right">쏠림 경보에 1분 응답해야 넘어갈 수 있어요</p>':''}`;
  document.querySelectorAll('[data-v]').forEach(el => el.onclick = () => {
    const g=el.dataset.v, n=el.dataset.n, d=+el.dataset.d; S.votes[g] = S.votes[g]||{}; const cur = S.votes[g][n]||0;
    if (d>0 && used(n)>=V) return toast(`${n}님은 표를 다 썼어요`);
    S.votes[g][n] = Math.max(0, cur+d); S.advocateSeen = false; save(); renderHost();
  });
  if ($('#v-heard')) $('#v-heard').onclick = () => { S.advocateSeen = true; log('악마의 대변인 1분 청취'); save(); renderHost(); };
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.final = b.dataset.f; log('최종안 결정'); save(); renderHost(); });
  $('#v-back').onclick = () => { S.clashIdx = S.candidates.length-1; setPhase('clash'); };
  $('#v-next').onclick = () => { suggestRoles(); setPhase('match'); };
}

/* ---- MATCH: 역할 ---- */
function suggestRoles(){
  const names = members(), roles = S.session.roles, load = Object.fromEntries(names.map(n=>[n,0])), out = {};
  const want = r => names.filter(n => (S.submissions[n].roles||[]).includes(r));
  roles.slice().sort((a,b)=>want(a).length-want(b).length).forEach(r => {
    const pool = want(r).length ? want(r) : names;
    const pick = pool.slice().sort((a,b)=>load[a]-load[b])[0];
    out[r] = pick; load[pick]++;
  });
  S.assign = out;
}
function hostMatch(){
  const names = members(), roles = S.session.roles;
  const loads = Object.fromEntries(names.map(n=>[n, roles.filter(r=>S.assign[r]===n).length]));
  const unhappy = roles.filter(r => S.assign[r] && !(S.submissions[S.assign[r]].roles||[]).includes(r));
  $('#app').innerHTML = `
  <span class="pill gray">LINK MATCH · 블라인드 희망 역할</span>
  <h1>최종안: ${esc(S.clash[S.final].text)}</h1>
  <div class="card">
    <b>희망 역할</b> <span class="muted small">(IN 단계에서 각자 몰래 고른 것 · 눈치 보며 남는 역할을 떠안지 않도록)</span>
    ${S.rolesRevealed ? `<table style="margin-top:8px"><tr><th>팀원</th>${roles.map(r=>`<th>${esc(r)}</th>`).join('')}</tr>${names.map(n=>`<tr><td>${esc(n)}</td>${roles.map(r=>`<td>${(S.submissions[n].roles||[]).includes(r)?'●':''}</td>`).join('')}</tr>`).join('')}</table>`
      : `<div class="row" style="margin-top:8px"><button class="primary" id="m-reveal">희망 역할 동시 공개</button></div>`}
  </div>
  ${S.rolesRevealed ? `
  <div class="card ai"><div class="who">AI 추천 (확정은 팀이)</div>희망을 최대한 반영하고, 한 사람에게 몰리지 않게 나눴어요.${unhappy.length?` 「${unhappy.map(esc).join(', ')}」는 지원자가 없어 부담이 적은 사람에게 배정했어요.`:''}</div>
  <div class="card"><table><tr><th>역할</th><th>담당</th></tr>${roles.map(r=>`<tr><td>${esc(r)}</td><td><select data-r="${esc(r)}">${names.map(n=>`<option ${S.assign[r]===n?'selected':''}>${esc(n)}</option>`).join('')}</select></td></tr>`).join('')}</table>
  <p class="small muted" style="margin-top:8px">1인당 역할 수: ${names.map(n=>`${esc(n)} ${loads[n]}`).join(' · ')}</p></div>
  <div class="row" style="justify-content:flex-end"><button class="primary" id="m-next">기여 기록 리포트 만들기 →</button></div>`:''}`;
  if ($('#m-reveal')) $('#m-reveal').onclick = () => { S.rolesRevealed = true; log('희망 역할 공개'); save(); renderHost(); };
  document.querySelectorAll('[data-r]').forEach(el => el.onchange = () => { S.assign[el.dataset.r] = el.value; save(); renderHost(); });
  if ($('#m-next')) $('#m-next').onclick = () => { S.endedAt = now(); log('회의 종료'); setPhase('report'); };
}

/* ---- UP: 리포트 ---- */
function reportData(){
  const names = members(), G = S.order.length, s = S.session;
  const fin = S.clash[S.final], finG = grp(S.final);
  const minority = S.order.filter(g=>grp(g).cardIds.length===1);
  const contrib = names.map(n => ({
    name:n, cards:S.submissions[n].cards.length,
    checked: S.order.filter(g => ((S.checks[g]||{})[n]||[]).length>0).length,
    votes: S.candidates.reduce((a,g)=>a+((S.votes[g]||{})[n]||0),0),
    roles: s.roles.filter(r=>S.assign[r]===n)
  }));
  const aiQ = S.order.length, aiR = Object.keys(S.clash).length;
  return {names, G, s, fin, finG, minority, contrib, aiQ, aiR, total:S.cards.length,
    finalFromMinority: finG.cardIds.length===1, mins: Math.round(((S.endedAt||now()) - (S.revealedAt||s.createdAt))/60000)};
}
function hostReport(){
  const d = reportData(), s = d.s;
  $('#app').innerHTML = `
  <div class="noprint row" style="justify-content:space-between"><span class="pill gray">LINK UP · 생각 출처 & 기여 기록</span>
    <div class="row"><button id="u-md">Notion용 마크다운 복사</button><button id="u-print">PDF로 저장 (교수자 제출용)</button><button id="u-json">백업</button></div></div>
  <div class="card">
    <h1>회의 리포트</h1>
    <p class="muted">${esc(s.topic)}<br>${new Date(s.createdAt).toLocaleDateString('ko-KR')} · 참여 ${d.names.length}명 · 공개 후 회의 ${d.mins}분</p>
    <div class="grid2" style="margin-top:12px">
      <div class="bucket"><span class="muted small">모인 아이디어 (팝콘 모델: 헤어지기 전 공유)</span><div class="big">${d.total}개 · 묶음 ${d.G}개</div></div>
      <div class="bucket"><span class="muted small">한 명만 낸 소수 의견</span><div class="big">${d.minority.length}개 ${d.finalFromMinority?'<span class="pill good">최종안이 소수 의견에서 나옴</span>':''}</div></div>
    </div>
    <h2>최종안</h2>
    <p class="big">${esc(d.fin.text)}</p>
    ${d.fin.text!==d.fin.original?`<p class="muted small">진화: 「${esc(d.fin.original)}」 → AI 반론(${REDPEN[d.fin.crit].crit}) → 팀 재반박 → 「${esc(d.fin.text)}」</p>`:''}
    <h2>생각의 출처</h2>
    <p>최종안은 <b>팀원의 카드</b>에서 출발했어요. AI는 질문 ${d.aiQ}번, 반론 ${d.aiR}번만 했고 아이디어를 직접 만들지 않았어요.</p>
    <h2>빨간 펜 기록</h2>
    <table><tr><th>아이디어</th><th>검증 기준</th><th>동의 / 재반박</th><th>결과</th><th>메모</th></tr>
    ${S.candidates.map(g=>{const k=S.clash[g]; if(!k) return ''; return `<tr><td>${esc(k.text)}</td><td>${REDPEN[k.crit].crit}</td><td>${k.agree} / ${k.rebut}</td><td>${({pass:'통과',revised:'수정 후 통과',drop:'탈락'})[k.outcome]||'-'}</td><td>${esc(k.memo)}</td></tr>`;}).join('')}</table>
    <h2>기여 기록</h2>
    <p class="muted small">말이 아니라 기록으로 남는 참여예요. 회의에서 조용했던 팀원의 기여도 보여요.</p>
    <table><tr><th>팀원</th><th>낸 아이디어</th><th>검토 참여</th><th>투표</th><th>맡은 역할</th></tr>
    ${d.contrib.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.cards}장</td><td>${c.checked} / ${d.G} 묶음</td><td>${c.votes}표</td><td>${c.roles.map(esc).join(', ')||'-'}</td></tr>`).join('')}</table>
    <h2>다음 세션으로</h2>
    <p class="muted">회의 후 떠오른 생각은 다음 세션의 LINK IN 카드로 내 주세요. (강의: 팝콘 모델)</p>
  </div>
  <div class="row noprint"><button onclick="go('new')">새 세션 만들기</button></div>`;
  $('#u-md').onclick = () => copy(reportMd());
  $('#u-print').onclick = () => window.print();
  $('#u-json').onclick = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})); a.download=`link-${s.id}.json`; a.click(); };
}
function reportMd(){
  const d = reportData(), s = d.s;
  return [`# LINK 회의 리포트`, ``, `- 주제: ${s.topic}`, `- 날짜: ${new Date(s.createdAt).toLocaleDateString('ko-KR')} · 참여 ${d.names.length}명`, `- 모인 아이디어: ${d.total}개 (묶음 ${d.G}개, 소수 의견 ${d.minority.length}개)`, ``,
    `## 최종안`, d.fin.text, d.fin.text!==d.fin.original?`\n진화: ${d.fin.original} → ${d.fin.text}`:'', ``,
    `## 생각의 출처`, `최종안은 팀원 카드에서 출발. AI는 질문 ${d.aiQ}회, 반론 ${d.aiR}회만 제시.`, ``,
    `## 빨간 펜 기록`, `| 아이디어 | 기준 | 동의/재반박 | 결과 | 메모 |`, `| --- | --- | --- | --- | --- |`,
    ...S.candidates.filter(g=>S.clash[g]).map(g=>{const k=S.clash[g]; return `| ${k.text} | ${REDPEN[k.crit].crit} | ${k.agree}/${k.rebut} | ${({pass:'통과',revised:'수정 후 통과',drop:'탈락'})[k.outcome]||'-'} | ${k.memo.replace(/\n/g,' ')} |`;}), ``,
    `## 기여 기록`, `| 팀원 | 아이디어 | 검토 참여 | 투표 | 역할 |`, `| --- | --- | --- | --- | --- |`,
    ...d.contrib.map(c=>`| ${c.name} | ${c.cards}장 | ${c.checked}/${d.G} | ${c.votes} | ${c.roles.join(', ')||'-'} |`)].join('\n');
}

    '서준':{c:[['우리 팀이 실제로 LINK로 회의한 결과를 보여준다','써 봤다는 증거가 가장 강한 근거다'],['경쟁 서비스 Parabol과 한 장으로 비교한다','차별점이 한눈에 보인다']], r:['자료조사']},
    '하윤':{c:[['팀플 장면을 첫 장에 넣고 공감을 얻는다','공감이 먼저 와야 설명이 들린다'],['수강생 설문으로 무임승차 고민 비율을 보여준다','숫자가 있으면 수요가 증명된다']], r:['자료조사','보고서 작성']},
    '도윤':{c:[['발표를 질문으로 시작한다','질문을 받으면 청중이 스스로 생각한다'],['우리 팀 실제 회의 결과를 리포트 화면으로 보여준다','실제 사용 기록이 설득력이 있다']], r:['일정관리']},
    '지아':{c:[['교수님 입장에서 기여 기록이 왜 필요한지 보여준다','돈을 내는 사람은 학생이 아니라 학교일 수 있다'],['발표를 15분 대신 7분으로 끝내고 질의를 늘린다','짧을수록 끝까지 듣는다']], r:['PPT 디자인','발표']}
  };
  Object.entries(D).forEach(([n,v]) => S.submissions[n] = {cards:v.c.map(([idea,reason])=>({idea,reason})), roles:v.r, at:now()});
  log('데모 세션 생성'); save(); go('host='+session.id); toast('데모 팀원 5명의 제출 코드를 받아 둔 상태예요');
}
